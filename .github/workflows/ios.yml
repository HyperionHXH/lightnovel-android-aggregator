name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/multi-source-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Build iOS simulator target
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -project Mixn.xcodeproj \
            -scheme Mixn \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | xcpretty

      - name: Run iOS unit tests
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -project Mixn.xcodeproj \
            -scheme Mixn \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test | xcpretty
