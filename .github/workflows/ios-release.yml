name: iOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.4.0'
        required: true
        default: v1.4.0
      export_method:
        description: 'IPA distribution method (ad-hoc requires registered device UDIDs)'
        type: choice
        options:
          - app-store
          - ad-hoc
        required: true
        default: app-store

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
      IOS_EXPORT_METHOD: ${{ github.event_name == 'workflow_dispatch' && inputs.export_method || 'app-store' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid tag: $tag" >&2; exit 1; }
          [[ "$IOS_EXPORT_METHOD" == "app-store" || "$IOS_EXPORT_METHOD" == "ad-hoc" ]] || { echo "Invalid export method: $IOS_EXPORT_METHOD" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "method=$IOS_EXPORT_METHOD" >> "$GITHUB_OUTPUT"

      - name: Validate Apple signing secrets
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for value in IOS_TEAM_ID IOS_BUNDLE_ID IOS_PROFILE_NAME CERTIFICATE CERTIFICATE_PASSWORD PROFILE; do
            [[ -n "${!value}" ]] || { echo "Missing iOS signing secret: $value" >&2; exit 1; }
          done

      - name: Import distribution certificate
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/mixn-signing.keychain-db"
          security create-keychain -p "runner" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "runner" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "runner" "$keychain"

      - name: Install provisioning profile
        shell: bash
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          [[ "$uuid" =~ ^[A-Fa-f0-9-]{36}$ ]] || { echo "Provisioning profile UUID is invalid: $uuid" >&2; exit 1; }
          profile_team=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.team-identifier' "$RUNNER_TEMP/profile.plist")
          [[ "$profile_team" == "$IOS_TEAM_ID" ]] || { echo "Profile Team ID ($profile_team) does not match IOS_TEAM_ID ($IOS_TEAM_ID)" >&2; exit 1; }
          profile_bundle=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist" | sed 's/^[^.]*\.//')
          [[ "$profile_bundle" == "$IOS_BUNDLE_ID" ]] || { echo "Profile bundle ID ($profile_bundle) does not match IOS_BUNDLE_ID ($IOS_BUNDLE_ID)" >&2; exit 1; }
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          [[ "$profile_name" == "$IOS_PROFILE_NAME" ]] || { echo "Profile name ($profile_name) does not match IOS_PROVISIONING_PROFILE_NAME ($IOS_PROFILE_NAME)" >&2; exit 1; }
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"

      - name: Archive
        working-directory: iosApp
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Mixn.xcodeproj \
            -scheme Mixn \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Mixn.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" | xcpretty

      - name: Export IPA
        env:
          VERSION: ${{ steps.version.outputs.name }}
          EXPORT_METHOD: ${{ steps.version.outputs.method }}
        shell: bash
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>${EXPORT_METHOD}</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>${IOS_TEAM_ID}</string>
          <key>provisioningProfiles</key><dict><key>${IOS_BUNDLE_ID}</key><string>${IOS_PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mixn.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" | xcpretty
          cp "$RUNNER_TEMP/export/Mixn.ipa" "Mixn-${VERSION}.ipa"
          shasum -a 256 "Mixn-${VERSION}.ipa" > "Mixn-${VERSION}.ipa.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mixn-iOS-${{ steps.version.outputs.name }}
          path: |
            Mixn-${{ steps.version.outputs.name }}.ipa
            Mixn-${{ steps.version.outputs.name }}.ipa.sha256
          if-no-files-found: error

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Mixn $VERSION" \
              --generate-notes || gh release view "$TAG"
          fi
          gh release upload "$TAG" "Mixn-${VERSION}.ipa" "Mixn-${VERSION}.ipa.sha256" --clobber

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          security delete-keychain "$RUNNER_TEMP/mixn-signing.keychain-db" 2>/dev/null || true
